name: googlehome
label: Google Home
kind: platform
version: 0.2.0
author: karmsheel
description: >
  Put a Google Home Mini (or any Google Home / Nest Cast speaker) on the other
  end of a Hermes profile's conversation. Replies are synthesized with Hermes's
  own TTS stack and cast to the speaker over the Cast v2 protocol (no
  third-party dependencies); voice input arrives through the host microphone and
  Hermes's STT, and each turn is routed to the profile you bind here. Adds
  googlehome_speak, googlehome_status, googlehome_volume and googlehome_devices.
homepage: https://github.com/karmsheel/google-home
requires_hermes: ">=0.21.5"
manifest_version: 2
python_dependencies: []
provides_tools:
  - googlehome_speak
  - googlehome_status
  - googlehome_volume
  - googlehome_devices
provides_hooks:
  - post_llm_call
  - post_tool_call
config_schema:
  device:
    type: str
    default: ""
    label: Speaker
    description: >
      IP address or friendly name of the speaker. Leave empty to use the first
      audio-only Cast device found on the network.
  profile:
    type: str
    default: ""
    label: Hermes profile
    description: >
      Profile that answers voice turns. Empty means the profile the gateway is
      already running (requires gateway.multiplex_profiles for other profiles).
  volume:
    type: int
    default: 0
    label: Speech volume (%)
    description: >
      Device volume to use while speaking (0-100). 0 leaves the speaker's own
      volume untouched.
  max_chars:
    type: int
    default: 1400
    label: Spoken reply limit
    description: Characters of a reply that are spoken; the rest stays in the chat.
  tts_provider:
    type: str
    default: ""
    label: TTS provider
    description: >
      Optional override of the profile's tts.provider for spoken replies. Hermes
      ignores an override that disagrees with tts.provider, so set tts.provider
      itself to change the voice engine.
  speech_backend:
    type: str
    default: auto
    choices: [auto, hermes, sapi, edge]
    label: Speech backend
    description: >
      auto tries Hermes TTS, then the offline Windows speech engine, then
      edge-tts, and remembers what worked. hermes respects tts.provider only;
      sapi is offline and keyless; edge needs network access.
  speech_voice:
    type: str
    default: ""
    label: Voice name
    description: >
      Optional voice for the sapi or edge backend, e.g. "Microsoft Zira Desktop"
      or "en-US-AriaNeural". Empty uses the backend default.
  control_port:
    type: int
    default: 8765
    label: Desktop control port
    description: Loopback port the Hermes Desktop extension connects to.
  speak_replies:
    type: bool
    default: true
    label: Speak replies
    description: Cast every agent reply to the speaker.
  speak_cron:
    type: bool
    default: true
    label: Speak cron job output
    description: >
      Speak cron deliveries addressed to this platform. Only a short digest is
      spoken; the full output still goes to the job's other delivery targets.
  cron_max_chars:
    type: int
    default: 400
    label: Spoken cron limit
    description: >
      Characters of a cron delivery that are spoken (80-2000). Keep this short:
      a notification should not tie up the speaker for minutes.
  proxy:
    type: bool
    default: false
    label: Forward to primary bridge
    description: >
      Secondary-profile mode: do not open another media server or Cast
      connection for this profile, forward speech to the primary bridge
      instead. Only for a multiplex gateway that already runs the speaker
      adapter in another profile.
